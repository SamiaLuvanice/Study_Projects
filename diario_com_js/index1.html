<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Diário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <main class="container diary-container">
    <section id="nameForm" class="mt-5">
      <h1 class="text-center">🌸 Olá! Vamos escrever juntos?</h1>
      <p class="text-center text-muted">Digite seu nome para começar o seu diário pessoal.</p>
      <div class="mb-3">
        <label for="userName" class="form-label">Seu nome:</label>
        <input type="text" class="form-control" id="userName" placeholder="Ex: Ana, Lucas...">
      </div>
      <button class="btn btn-primary w-100" onclick="startDiary()">Começar</button>
    </section>

    <section id="diaryPage" class="d-none">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="headerTitle" class="m-0">Diário</h2>
        <span class="badge" id="noteCount">0 notas</span>
      </header>

      <h3 id="greeting" class="text-center mb-4"></h3>

      <article class="diary-entry mb-4">
        <label for="entryDate" class="form-label">📅 Escolha a data:</label>
        <input type="date" class="form-control mb-3" id="entryDate">

        <label for="entryText" class="form-label">📝 Escreva como foi seu dia:</label>
        <textarea class="form-control" id="entryText" rows="6" placeholder="Hoje eu me senti..."></textarea>
        <button class="btn btn-success mt-3 w-100" onclick="saveEntry()">Salvar</button>
      </article>

      <section id="entriesList" aria-label="Lista de entradas do diário"></section>
    </section>
  </main>

  <script src="script1.js"></script>
</body>
</html>
